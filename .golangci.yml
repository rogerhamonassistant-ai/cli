version: "2"

linters:
  default: none
  enable:
    - asasalint # checks for pass []any as any in variadic func(...any)
    - asciicheck # checks that your code does not contain non-ASCII identifiers
    - bidichk # checks for dangerous unicode character sequences
    - bodyclose # checks whether HTTP response body is closed successfully
    - copyloopvar # detects places where loop variables are copied (Go 1.22+)
    - durationcheck # checks for two durations multiplied together
    - exptostd # detects functions from golang.org/x/exp/ that can be replaced by std functions
    - fatcontext # detects nested contexts in loops
    - gocheckcompilerdirectives # validates go compiler directive comments (//go:)
    - gochecksumtype # checks exhaustiveness on Go "sum types"
    - gocritic # provides diagnostics that check for bugs, performance and style issues
    - gomoddirectives # manages the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - goprintffuncname # checks that printf-like functions are named with f at the end
    - govet # reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - ineffassign # detects when assignments to existing variables are not used
    - nilerr # finds the code that returns nil even if it checks that the error is not nil
    - nolintlint # reports ill-formed or insufficient nolint directives
    - nosprintfhostport # checks for misuse of Sprintf to construct a host with port in a URL
    - reassign # checks that package variables are not reassigned
    - unused # checks for unused constants, variables, functions and types

    # To enable later due to too many issues, and confirm we need them:
    # - gosec
    # - staticcheck
    # - errcheck
  exclusions:
    paths:
      - third-party
    rules:
      - path: _test\.go$
        linters:
          - bodyclose
          - gosec
  settings:
    gomoddirectives:
      # Backport compatibility pins are expected on this branch.
      replace-allow-list:
        - charm.land/bubbles/v2
        - charm.land/bubbletea/v2
        - charm.land/huh/v2
        - charm.land/lipgloss/v2
        - github.com/charmbracelet/colorprofile
        - github.com/charmbracelet/ultraviolet
        - github.com/charmbracelet/x/ansi
        - github.com/cli/go-gh/v2
        - github.com/docker/cli
        - github.com/gdamore/tcell/v2
        - github.com/google/go-containerregistry
        - github.com/lucasb-eyer/go-colorful
        - github.com/mattn/go-runewidth
        - github.com/sigstore/rekor
        - github.com/sigstore/sigstore
        - github.com/sigstore/sigstore-go
        - github.com/sigstore/timestamp-authority/v2
        - github.com/theupdateframework/go-tuf/v2
        - go.opentelemetry.io/otel
        - go.opentelemetry.io/otel/metric
        - go.opentelemetry.io/otel/sdk
        - go.opentelemetry.io/otel/sdk/metric
        - go.opentelemetry.io/otel/trace
        - golang.org/x/crypto
        - golang.org/x/mod
        - golang.org/x/net
        - golang.org/x/sync
        - golang.org/x/sys
        - golang.org/x/term
        - golang.org/x/text
        - golang.org/x/tools
        - google.golang.org/genproto/googleapis/api
        - google.golang.org/genproto/googleapis/rpc
        - google.golang.org/grpc
    gocritic:
      disabled-checks:
        - appendAssign
      disabled-tags:
        - style
    gosec:
      excludes:
        - G110
        - G204
        - G301
        - G302
        - G304
        - G307
        - G404
      config:
        G104:
          os:
            - Setenv
    govet:
      enable:
        - httpresponse

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - third-party

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
